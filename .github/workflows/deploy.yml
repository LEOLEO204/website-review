name: Deploy Website to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy static files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "dist/*"
          target: "/var/www/review_tot_system_com"
          strip_components: 1
          overwrite: true

      - name: Copy backend server files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "server/*"
          target: "/var/www/review_tot_system_com/server"
          strip_components: 1
          overwrite: true

      - name: Configure Nginx, Install Backend Deps, and Restart Services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # Set permissions
            sudo mkdir -p /var/www/review_tot_system_com/uploads
            sudo chown -R root:www-data /var/www/review_tot_system_com
            sudo chmod -R 775 /var/www/review_tot_system_com

            # Write Nginx configuration block
            sudo cat << 'EOF' > /etc/nginx/sites-available/review_tot_system_com
            server {
                listen 80;
                server_name review.totsystem.com;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                server_name review.totsystem.com;

                ssl_certificate /etc/letsencrypt/live/review.totsystem.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/review.totsystem.com/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

                root /var/www/review_tot_system_com;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:3000/api/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    client_max_body_size 50M;
                }

                location /uploads/ {
                    alias /var/www/review_tot_system_com/uploads/;
                    expires 7d;
                    add_header Cache-Control "public";
                }

                gzip on;
                gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
            }
            EOF

            sudo ln -sf /etc/nginx/sites-available/review_tot_system_com /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            
            # Reload Nginx if configuration test passes
            sudo nginx -t && sudo systemctl reload nginx || sudo systemctl restart nginx

            # Setup Node.js backend server
            cd /var/www/review_tot_system_com/server
            npm install --production
            pm2 describe reviewsmart-api > /dev/null && pm2 restart reviewsmart-api || pm2 start server.js --name reviewsmart-api
            pm2 save

